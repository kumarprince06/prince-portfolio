  <text xml:space="preserve" x="355" y="200" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">No rehash: test one bit,  hash &amp; 16</text>
  <text xml:space="preserve" x="355" y="238" fill="#888888" font-family="Arial, sans-serif" font-size="14">key</text>
  <text xml:space="preserve" x="430" y="238" fill="#888888" font-family="Arial, sans-serif" font-size="14">binary</text>
