  <text xml:space="preserve" x="80" y="585" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">5 &amp; 31 = 5,  21 &amp; 31 = 21,  37 &amp; 31 = 5,  53 &amp; 31 = 21  — the same answer the one-bit test gives.</text>
