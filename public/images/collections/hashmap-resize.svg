  <text xml:space="preserve" x="355" y="371" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">37</text>
  <text xml:space="preserve" x="430" y="371" fill="#C6A17A" font-family="Arial, sans-serif" font-size="17">100101</text>
  <text xml:space="preserve" x="575" y="371" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">0</text>
  <text xml:space="preserve" x="640" y="371" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">5  (stays)</text>
  <text xml:space="preserve" x="355" y="419" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">53</text>
  <text xml:space="preserve" x="430" y="419" fill="#C6A17A" font-family="Arial, sans-serif" font-size="17">110101</text>
  <text xml:space="preserve" x="575" y="419" fill="#FB923C" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">16</text>
  <text xml:space="preserve" x="640" y="419" fill="#FB923C" font-family="Arial, sans-serif" font-size="16">21 (5 + 16)</text>
  <text xml:space="preserve" x="355" y="480" fill="#888888" font-family="Arial, sans-serif" font-size="15">0 → lo list, same index</text>
  <text xml:space="preserve" x="355" y="505" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">16 → hi list, index + oldCap</text>
