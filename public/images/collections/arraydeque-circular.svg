<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">ARRAYDEQUE IS A CIRCULAR ARRAY</text>
  <text xml:space="preserve" x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">head and tail are indexes that wrap around; nothing is ever shifted.</text>
  <rect x="80" y="175" width="70" height="48" rx="4" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="115.0" y="206" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">A</text>
  <text xml:space="preserve" x="115.0" y="167" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0</text>
  <rect x="150" y="175" width="70" height="48" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="185.0" y="206" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">B</text>
  <text xml:space="preserve" x="185.0" y="167" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1</text>
  <rect x="220" y="175" width="70" height="48" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
