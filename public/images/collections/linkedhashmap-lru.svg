  <text xml:space="preserve" x="720" y="349" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Agra  ₹700</text>
  <path d="M782 336L816 336" stroke="#FB923C" stroke-width="2"/>
  <path d="M807.3 341.0L816 336L807.3 331.0" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M818 352L784 352" stroke="#C6A17A" stroke-width="2"/>
  <path d="M792.7 347.0L784 352L792.7 357.0" stroke="#C6A17A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="820" y="318" width="120" height="50" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="880" y="349" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Goa  ₹900</text>
  <text xml:space="preserve" x="560" y="388" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">head (eldest)</text>
  <text xml:space="preserve" x="880" y="388" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">tail (newest)</text>
  <text xml:space="preserve" x="500" y="430" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">3. put("Ooty") makes size 4 &gt; 3: evict the head</text>
  <rect x="500" y="448" width="100" height="50" rx="10" fill="#171717" stroke="#555555" stroke-width="2" stroke-dasharray="6 6"/>
  <text xml:space="preserve" x="550" y="479" fill="#888888" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Pune</text>
  <path d="M515 473L585 473" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="550" y="518" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">evicted</text>
  <rect x="640" y="448" width="120" height="50" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="700" y="479" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Agra  ₹700</text>
  <path d="M762 466L796 466" stroke="#FB923C" stroke-width="2"/>
  <path d="M787.3 471.0L796 466L787.3 461.0" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M798 482L764 482" stroke="#C6A17A" stroke-width="2"/>
  <path d="M772.7 477.0L764 482L772.7 487.0" stroke="#C6A17A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="800" y="448" width="120" height="50" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="860" y="479" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Goa  ₹900</text>
  <path d="M922 466L956 466" stroke="#FB923C" stroke-width="2"/>
  <path d="M947.3 471.0L956 466L947.3 461.0" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M958 482L924 482" stroke="#C6A17A" stroke-width="2"/>
  <path d="M932.7 477.0L924 482L932.7 487.0" stroke="#C6A17A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="960" y="448" width="120" height="50" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="1020" y="479" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Ooty  ₹1200</text>
  <text xml:space="preserve" x="700" y="518" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">head (eldest)</text>
  <text xml:space="preserve" x="1020" y="518" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">tail (newest)</text>
  <text xml:space="preserve" x="80" y="590" fill="#888888" font-family="Arial, sans-serif" font-size="15">get() and put() stay O(1): the bucket finds the entry, then two links are rewired.</text>
</svg>
