<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">LINKEDHASHMAP AS AN LRU CACHE</text>
  <text xml:space="preserve" x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Recent fare quotes, capacity 3. Hash table for lookup, linked list for order.</text>
  <rect x="80" y="160" width="370" height="300" rx="16" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="105" y="198" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">new LinkedHashMap&lt;&gt;(16, 0.75f, true)</text>
  <text xml:space="preserve" x="105" y="228" fill="#888888" font-family="Arial, sans-serif" font-size="15">  // true = access order</text>
  <text xml:space="preserve" x="105" y="258" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15"></text>
  <text xml:space="preserve" x="105" y="288" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">protected boolean</text>
  <text xml:space="preserve" x="105" y="318" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">removeEldestEntry(e) {</text>
  <text xml:space="preserve" x="105" y="348" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">  return size() &gt; 3;</text>
  <text xml:space="preserve" x="105" y="378" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">}</text>
  <text xml:space="preserve" x="105" y="430" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">every entry: hash bucket + before/after</text>
  <text xml:space="preserve" x="500" y="170" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">1. put Goa, Pune, Agra</text>
  <rect x="500" y="188" width="120" height="50" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="560" y="219" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Goa  ₹900</text>
  <path d="M622 206L656 206" stroke="#FB923C" stroke-width="2"/>
  <path d="M647.3 211.0L656 206L647.3 201.0" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M658 222L624 222" stroke="#C6A17A" stroke-width="2"/>
  <path d="M632.7 217.0L624 222L632.7 227.0" stroke="#C6A17A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
