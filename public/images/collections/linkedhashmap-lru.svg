  <text xml:space="preserve" x="720" y="219" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Pune  ₹450</text>
  <path d="M782 206L816 206" stroke="#FB923C" stroke-width="2"/>
  <path d="M807.3 211.0L816 206L807.3 201.0" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M818 222L784 222" stroke="#C6A17A" stroke-width="2"/>
  <path d="M792.7 217.0L784 222L792.7 227.0" stroke="#C6A17A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="820" y="188" width="120" height="50" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="880" y="219" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Agra  ₹700</text>
  <text xml:space="preserve" x="560" y="258" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">head (eldest)</text>
  <text xml:space="preserve" x="880" y="258" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">tail (newest)</text>
  <text xml:space="preserve" x="500" y="300" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">2. get("Goa") moves Goa to the tail</text>
  <rect x="500" y="318" width="120" height="50" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="560" y="349" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Pune  ₹450</text>
  <path d="M622 336L656 336" stroke="#FB923C" stroke-width="2"/>
