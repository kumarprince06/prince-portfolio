<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">WHY FOR-EACH + REMOVE THROWS</text>
  <text xml:space="preserve" x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">The iterator remembers modCount; any change it did not make is caught on next().</text>
  <rect x="80" y="160" width="420" height="200" rx="14" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="105" y="196" fill="#888888" font-family="Arial, sans-serif" font-size="15">// cities = [Pune, Goa, Agra, Delhi]</text>
  <text xml:space="preserve" x="105" y="226" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">for (String city : cities) {</text>
  <text xml:space="preserve" x="105" y="256" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">  if (city.equals("Goa"))</text>
  <text xml:space="preserve" x="105" y="286" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">    cities.remove(city);</text>
  <text xml:space="preserve" x="105" y="316" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">}</text>
  <text xml:space="preserve" x="105" y="343" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">for-each is just hasNext() / next()</text>
  <rect x="560" y="160" width="560" height="44" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="580" y="188" fill="#FB923C" font-family="Arial, sans-serif" font-size="14">1</text>
  <text xml:space="preserve" x="605" y="188" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">iterator created</text>
  <text xml:space="preserve" x="1100" y="188" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="end">expectedModCount = modCount = 4</text>
  <rect x="560" y="212" width="560" height="44" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="580" y="240" fill="#FB923C" font-family="Arial, sans-serif" font-size="14">2</text>
  <text xml:space="preserve" x="605" y="240" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">next() → "Pune",  next() → "Goa"</text>
  <text xml:space="preserve" x="1100" y="240" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="end">counts match, keep going</text>
  <rect x="560" y="264" width="560" height="44" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="580" y="292" fill="#FB923C" font-family="Arial, sans-serif" font-size="14">3</text>
  <text xml:space="preserve" x="605" y="292" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">cities.remove("Goa")</text>
  <text xml:space="preserve" x="1100" y="292" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="end">list changes: modCount = 5, iterator not told</text>
  <rect x="560" y="316" width="560" height="44" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="580" y="344" fill="#FB923C" font-family="Arial, sans-serif" font-size="14">4</text>
  <text xml:space="preserve" x="605" y="344" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">next() checks 5 ≠ 4</text>
  <text xml:space="preserve" x="1100" y="344" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" text-anchor="end">throws ConcurrentModificationException</text>
  <path d="M500 260L552 260" stroke="#FB923C" stroke-width="3"/>
  <path d="M543.3 265.0L552 260L543.3 255.0" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 400H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="435" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">SAFE WAYS TO REMOVE WHILE LOOPING</text>
  <rect x="80" y="455" width="330" height="120" rx="14" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="102" y="492" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">it.remove()</text>
  <text xml:space="preserve" x="102" y="526" fill="#888888" font-family="Arial, sans-serif" font-size="15">explicit Iterator; it updates</text>
  <text xml:space="preserve" x="102" y="550" fill="#888888" font-family="Arial, sans-serif" font-size="15">expectedModCount itself</text>
  <rect x="435" y="455" width="330" height="120" rx="14" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="457" y="492" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">cities.removeIf(c -&gt; ...)</text>
  <text xml:space="preserve" x="457" y="526" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">one call, no loop of yours,</text>
  <text xml:space="preserve" x="457" y="550" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">O(n) for ArrayList</text>
  <rect x="790" y="455" width="330" height="120" rx="14" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="812" y="492" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">CopyOnWriteArrayList</text>
  <text xml:space="preserve" x="812" y="526" fill="#888888" font-family="Arial, sans-serif" font-size="15">fail-safe: iterates a snapshot,</text>
  <text xml:space="preserve" x="812" y="550" fill="#888888" font-family="Arial, sans-serif" font-size="15">never throws CME</text>
</svg>
