<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">HOW HASHMAP.PUT FINDS A BUCKET</text>
  <text xml:space="preserve" x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">A 16-slot table. The key's hash picks the slot, equals() picks the entry.</text>
  <rect x="80" y="156" width="360" height="62" rx="12" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="100" y="193" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">put("Pune", 5)</text>
  <path d="M260 218L260 228" stroke="#FB923C" stroke-width="2"/>
  <path d="M255.0 219.3L260 228L265.0 219.3" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="230" width="360" height="62" rx="12" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="100" y="257" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">h = "Pune".hashCode()</text>
  <text xml:space="preserve" x="100" y="279" fill="#888888" font-family="Arial, sans-serif" font-size="14">2499228 = 0x26229C</text>
  <path d="M260 292L260 302" stroke="#FB923C" stroke-width="2"/>
  <path d="M255.0 293.3L260 302L265.0 293.3" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="304" width="360" height="62" rx="12" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="100" y="331" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">hash = h ^ (h &gt;&gt;&gt; 16)</text>
  <text xml:space="preserve" x="100" y="353" fill="#888888" font-family="Arial, sans-serif" font-size="14">0x26229C ^ 0x26 = 0x2622BA</text>
  <path d="M260 366L260 376" stroke="#FB923C" stroke-width="2"/>
  <path d="M255.0 367.3L260 376L265.0 367.3" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="378" width="360" height="62" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="100" y="405" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">index = (16 - 1) &amp; hash</text>
  <text xml:space="preserve" x="100" y="427" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">0xF &amp; 0x2622BA = 10</text>
  <rect x="500" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="519.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">0</text>
  <rect x="538" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="557.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">1</text>
  <rect x="576" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="595.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">2</text>
  <rect x="614" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="633.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">3</text>
  <rect x="652" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="671.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">4</text>
  <rect x="690" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="709.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">5</text>
  <rect x="728" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="747.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">6</text>
  <rect x="766" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="785.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">7</text>
  <rect x="804" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="823.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">8</text>
  <rect x="842" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="861.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">9</text>
  <rect x="880" y="175" width="38" height="44" rx="4" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="899.0" y="165" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">10</text>
  <rect x="918" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="937.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">11</text>
  <rect x="956" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="975.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">12</text>
  <rect x="994" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="1013.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">13</text>
  <rect x="1032" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="1051.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">14</text>
  <rect x="1070" y="175" width="38" height="44" rx="4" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="1089.0" y="165" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">15</text>
  <text xml:space="preserve" x="500" y="245" fill="#888888" font-family="Arial, sans-serif" font-size="14">table[ ]   dots: Delhi in 1, Goa in 8, Mumbai in 13</text>
  <circle cx="557.0" cy="197" r="5" fill="#888888"/>
  <circle cx="823.0" cy="197" r="5" fill="#888888"/>
  <circle cx="1013.0" cy="197" r="5" fill="#888888"/>
  <path d="M440 401L897.0 222" stroke="#FB923C" stroke-width="2"/>
  <path d="M890.8 229.8L897.0 222L887.1 220.5" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M899.0 219L899.0 270" stroke="#FB923C" stroke-width="2"/>
  <rect x="819.0" y="272" width="160" height="52" rx="10" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="899.0" y="296" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">"Kolkata" → 2</text>
  <text xml:space="preserve" x="899.0" y="315" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">hash 0x430112AA</text>
  <path d="M899.0 324L899.0 352" stroke="#FB923C" stroke-width="2"/>
  <path d="M894.0 343.3L899.0 352L904.0 343.3" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="819.0" y="354" width="160" height="52" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="899.0" y="378" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">"Pune" → 5</text>
  <text xml:space="preserve" x="899.0" y="397" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">next = null</text>
  <text xml:space="preserve" x="999.0" y="300" fill="#888888" font-family="Arial, sans-serif" font-size="14">collision: both land</text>
  <text xml:space="preserve" x="999.0" y="320" fill="#888888" font-family="Arial, sans-serif" font-size="14">in bucket 10, so put()</text>
  <text xml:space="preserve" x="999.0" y="340" fill="#888888" font-family="Arial, sans-serif" font-size="14">walks the chain, checks</text>
  <text xml:space="preserve" x="999.0" y="360" fill="#888888" font-family="Arial, sans-serif" font-size="14">hash + equals(), then</text>
  <text xml:space="preserve" x="999.0" y="380" fill="#888888" font-family="Arial, sans-serif" font-size="14">appends at the tail</text>
  <path d="M80 460H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="495" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">WHEN ONE BUCKET GETS CROWDED</text>
  <rect x="80" y="515" width="46" height="30" rx="6" fill="#171717" stroke="#555555" stroke-width="2"/>
  <path d="M126 530L140 530" stroke="#555555" stroke-width="2"/>
  <path d="M131.3 535.0L140 530L131.3 525.0" stroke="#555555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="142" y="515" width="46" height="30" rx="6" fill="#171717" stroke="#555555" stroke-width="2"/>
  <path d="M188 530L202 530" stroke="#555555" stroke-width="2"/>
  <path d="M193.3 535.0L202 530L193.3 525.0" stroke="#555555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="204" y="515" width="46" height="30" rx="6" fill="#171717" stroke="#555555" stroke-width="2"/>
  <path d="M250 530L264 530" stroke="#555555" stroke-width="2"/>
  <path d="M255.3 535.0L264 530L255.3 525.0" stroke="#555555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="266" y="515" width="46" height="30" rx="6" fill="#171717" stroke="#555555" stroke-width="2"/>
  <path d="M312 530L326 530" stroke="#555555" stroke-width="2"/>
  <path d="M317.3 535.0L326 530L317.3 525.0" stroke="#555555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="328" y="515" width="46" height="30" rx="6" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="570" fill="#888888" font-family="Arial, sans-serif" font-size="14">long chain: O(n) to search</text>
  <path d="M420 530L500 530" stroke="#FB923C" stroke-width="3"/>
  <path d="M491.3 535.0L500 530L491.3 525.0" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text xml:space="preserve" x="460" y="515" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">treeify</text>
  <path d="M590 505L550 545" stroke="#555555" stroke-width="2"/>
  <path d="M590 505L630 545" stroke="#555555" stroke-width="2"/>
  <circle cx="590" cy="505" r="13" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <circle cx="550" cy="545" r="13" fill="#171717" stroke="#555555" stroke-width="2"/>
  <circle cx="630" cy="545" r="13" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="670" y="512" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">TREEIFY_THRESHOLD = 8: a bucket already holding 8 gets one more</text>
  <text xml:space="preserve" x="670" y="536" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">and table length ≥ 64 (MIN_TREEIFY_CAPACITY), else it resizes</text>
  <text xml:space="preserve" x="670" y="560" fill="#888888" font-family="Arial, sans-serif" font-size="15">TreeNode bin: O(log n); turns back into a list at 6</text>
</svg>
