<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">A HASHSET IS A HASHMAP INSIDE</text>
  <text xml:space="preserve" x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Every element becomes a key; every value is the same dummy object.</text>
  <rect x="80" y="165" width="320" height="255" rx="16" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="110" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">HashSet&lt;String&gt; cities</text>
  <text xml:space="preserve" x="110" y="245" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">private transient</text>
  <text xml:space="preserve" x="110" y="268" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">HashMap&lt;E, Object&gt; map;</text>
  <text xml:space="preserve" x="110" y="315" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">add(e)</text>
  <text xml:space="preserve" x="205" y="315" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">→ map.put(e, PRESENT)</text>
  <text xml:space="preserve" x="110" y="343" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">contains(e)</text>
  <text xml:space="preserve" x="205" y="343" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">→ map.containsKey(e)</text>
  <text xml:space="preserve" x="110" y="371" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">remove(e)</text>
  <text xml:space="preserve" x="205" y="371" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">→ map.remove(e)</text>
  <text xml:space="preserve" x="110" y="399" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">size()</text>
  <text xml:space="preserve" x="205" y="399" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">→ map.size()</text>
  <path d="M400 290L470 290" stroke="#FB923C" stroke-width="3"/>
  <path d="M461.3 295.0L470 290L461.3 285.0" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text xml:space="preserve" x="480" y="170" fill="#888888" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">internal map</text>
  <text xml:space="preserve" x="560" y="200" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">key</text>
  <text xml:space="preserve" x="735" y="200" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">value</text>
  <rect x="480" y="215" width="160" height="46" rx="8" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="560" y="244" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Pune</text>
  <rect x="660" y="215" width="150" height="46" rx="8" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="735" y="244" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">PRESENT</text>
  <path d="M810 238L900 290" stroke="#FB923C" stroke-width="2"/>
  <path d="M890.0 290.0L900 290L895.0 281.3" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="480" y="277" width="160" height="46" rx="8" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="560" y="306" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Goa</text>
  <rect x="660" y="277" width="150" height="46" rx="8" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="735" y="306" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">PRESENT</text>
  <path d="M810 300L900 290" stroke="#FB923C" stroke-width="2"/>
  <path d="M891.9 295.9L900 290L890.8 286.0" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="480" y="339" width="160" height="46" rx="8" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="560" y="368" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Agra</text>
  <rect x="660" y="339" width="150" height="46" rx="8" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="735" y="368" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">PRESENT</text>
  <path d="M810 362L900 290" stroke="#FB923C" stroke-width="2"/>
  <path d="M896.4 299.3L900 290L890.1 291.5" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="905" y="245" width="215" height="90" rx="14" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text xml:space="preserve" x="1012" y="280" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">PRESENT</text>
  <text xml:space="preserve" x="1012" y="308" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">static final Object</text>
  <text xml:space="preserve" x="1012" y="365" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">one shared object,</text>
  <text xml:space="preserve" x="1012" y="385" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">not one per element</text>
  <path d="M80 450H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text xml:space="preserve" x="80" y="485" fill="#FB923C" font-family="Arial, sans-serif" font-size="16">add(e) returns map.put(e, PRESENT) == null</text>
  <rect x="80" y="505" width="500" height="70" rx="12" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="105" y="535" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">add("Ooty") → put returns null</text>
  <text xml:space="preserve" x="105" y="560" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">new key → true, element added</text>
  <rect x="620" y="505" width="500" height="70" rx="12" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text xml:space="preserve" x="645" y="535" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">add("Goa") again → put returns PRESENT</text>
  <text xml:space="preserve" x="645" y="560" fill="#888888" font-family="Arial, sans-serif" font-size="15">key already there → false, nothing changes</text>
</svg>
