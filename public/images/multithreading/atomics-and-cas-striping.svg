<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">ONE CONTENDED CACHE LINE, OR MANY QUIET ONES</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">JDK 21, 8 logical CPUs. Throughput is the best of 3 runs on a loaded laptop, not JMH.</text>

  <!-- left: CAS loop -->
  <rect x="80" y="160" width="330" height="290" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">A CAS retry loop</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="100" y="232" fill="#C6A17A">do {</text>
    <text x="100" y="254" fill="#FFFFFF">  seen = value;       // read</text>
    <text x="100" y="276" fill="#FFFFFF">  next = f(seen);     // compute</text>
    <text x="100" y="298" fill="#C6A17A">} while (!CAS(seen, next));</text>
  </g>
  <text x="100" y="336" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">x86: CAS is lock cmpxchg; getAndAdd is</text>
  <text x="100" y="356" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">lock xadd (no retry needed).</text>
  <text x="100" y="390" fill="#FB923C" font-family="Arial, sans-serif" font-size="13">8 threads: f ran 2.4 to 4.1 times</text>
  <text x="100" y="410" fill="#FB923C" font-family="Arial, sans-serif" font-size="13">per successful update (measured).</text>
  <text x="100" y="434" fill="#888888" font-family="Arial, sans-serif" font-size="13">So f must have no side effects.</text>

  <!-- middle: AtomicLong -->
  <rect x="440" y="160" width="320" height="290" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="460" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">AtomicLong: one hot line</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <rect x="460" y="214" width="56" height="30" rx="6" fill="#132433" stroke="#60A5FA"/><text x="472" y="234" fill="#FFFFFF">cpu0</text>
    <rect x="530" y="214" width="56" height="30" rx="6" fill="#132433" stroke="#60A5FA"/><text x="542" y="234" fill="#FFFFFF">cpu1</text>
    <rect x="600" y="214" width="56" height="30" rx="6" fill="#132433" stroke="#60A5FA"/><text x="612" y="234" fill="#FFFFFF">cpu2</text>
    <rect x="670" y="214" width="70" height="30" rx="6" fill="#132433" stroke="#60A5FA"/><text x="682" y="234" fill="#FFFFFF">... cpu7</text>
  </g>
  <path d="M488 244L590 300" stroke="#FB923C" stroke-width="1.5"/>
  <path d="M558 244L595 300" stroke="#FB923C" stroke-width="1.5"/>
  <path d="M628 244L605 300" stroke="#FB923C" stroke-width="1.5"/>
  <path d="M705 244L610 300" stroke="#FB923C" stroke-width="1.5"/>
  <rect x="495" y="300" width="210" height="44" rx="8" fill="#0D0D0D" stroke="#FB923C" stroke-width="2"/>
  <text x="516" y="327" fill="#FB923C" font-family="Courier New, monospace" font-size="14">volatile long value</text>
  <text x="460" y="378" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">The line moves core to core on every</text>
  <text x="460" y="398" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">increment: adding threads adds no speed.</text>
  <text x="460" y="430" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">1 thread 119-148 M/s · 8 threads 40-52 M/s</text>

  <!-- right: LongAdder -->
  <rect x="790" y="160" width="330" height="290" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="810" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">LongAdder: base + cells</text>
  <rect x="810" y="214" width="290" height="34" rx="6" fill="#132433" stroke="#60A5FA"/>
  <text x="824" y="236" fill="#FFFFFF" font-family="Courier New, monospace" font-size="13">base   (used until a CAS fails)</text>
  <g font-family="Courier New, monospace" font-size="12">
    <rect x="810" y="262" width="66" height="34" rx="6" fill="#21180F" stroke="#FB923C"/><text x="822" y="284" fill="#C6A17A">cell0</text>
    <rect x="884" y="262" width="66" height="34" rx="6" fill="#21180F" stroke="#FB923C"/><text x="896" y="284" fill="#C6A17A">cell1</text>
    <rect x="958" y="262" width="66" height="34" rx="6" fill="#21180F" stroke="#FB923C"/><text x="970" y="284" fill="#C6A17A">cell2</text>
    <rect x="1032" y="262" width="68" height="34" rx="6" fill="#21180F" stroke="#FB923C"/><text x="1040" y="284" fill="#C6A17A">..cell7</text>
  </g>
  <text x="810" y="324" fill="#93B4D6" font-family="Arial, sans-serif" font-size="13">Each Cell is @Contended (own line). Thread</text>
  <text x="810" y="344" fill="#93B4D6" font-family="Arial, sans-serif" font-size="13">picks cells[probe &amp; (n-1)]; n grows to NCPU.</text>
  <text x="810" y="378" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">sum() = base + every cell, read one by one:</text>
  <text x="810" y="398" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">not a snapshot.</text>
  <text x="810" y="430" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">1 thread 75-99 M/s · 8 threads 365-569 M/s</text>

  <!-- bottom: false sharing -->
  <text x="80" y="500" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">False sharing: two counters, two threads, one 64-byte line</text>
  <g font-family="Courier New, monospace" font-size="12">
    <rect x="80" y="518" width="96" height="40" fill="#151515" stroke="#444444"/><text x="90" y="543" fill="#888888">bytes 0-15</text>
    <rect x="176" y="518" width="80" height="40" fill="#21180F" stroke="#FB923C" stroke-width="2"/><text x="186" y="543" fill="#FB923C">asha +16</text>
    <rect x="256" y="518" width="80" height="40" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/><text x="266" y="543" fill="#93B4D6">ravi +24</text>
    <rect x="336" y="518" width="224" height="40" fill="#151515" stroke="#444444"/><text x="350" y="543" fill="#888888">rest of the same line</text>
  </g>
  <text x="80" y="584" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">Unpadded: 0.8 to 2.4 s for 2 x 50M volatile increments.</text>

  <g font-family="Courier New, monospace" font-size="12">
    <rect x="620" y="518" width="80" height="40" fill="#21180F" stroke="#FB923C" stroke-width="2"/><text x="630" y="543" fill="#FB923C">asha</text>
    <rect x="700" y="518" width="160" height="40" fill="#151515" stroke="#444444"/><text x="712" y="543" fill="#888888">padding</text>
    <rect x="860" y="518" width="4" height="40" fill="#FB923C"/>
    <rect x="864" y="518" width="80" height="40" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/><text x="874" y="543" fill="#93B4D6">ravi</text>
    <rect x="944" y="518" width="176" height="40" fill="#151515" stroke="#444444"/><text x="956" y="543" fill="#888888">next line</text>
  </g>
  <text x="620" y="584" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">Padded (56 bytes) or @Contended (128): 0.27 to 0.40 s.</text>

  <text x="80" y="640" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">@Contended outside java.base needs --add-exports to compile and -XX:-RestrictContended to run;</text>
  <text x="80" y="664" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">without the flag the annotation is silently ignored (offsets stay 16 and 24).</text>
  <text x="80" y="712" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">Contended counter: LongAdder. Exact compare-and-act: CAS. Many fields: VarHandle or a field updater.</text>
</svg>
