  <text x="100" y="786" fill="#FB923C" font-family="Arial, sans-serif" font-size="13">floorEntry(155): go right while the next key is &lt;= 155, else go down. H, 90, (down, down), 130, (down), 140, 150: found 150</text>
  <text x="100" y="806" fill="#FB923C" font-family="Arial, sans-serif" font-size="13">4 moves right and 3 down, instead of walking 15 base nodes from the start</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#BBBBBB">
    <text x="100" y="840">1,000,000 keys: 25.05% on level 1, about half as many on each level above, 17 levels, 501,668 Index objects (0.50 per key)</text>
    <text x="100" y="862">36 bytes per entry (24-byte Node + half a 24-byte Index), against 40 for TreeMap and 41.5 for ConcurrentHashMap</text>
    <text x="100" y="884">remove: CAS val to null, append a marker node (key null), then unlink; get() takes no lock; size() reads a LongAdder</text>
