<svg width="1200" height="940" viewBox="0 0 1200 940" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="940" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">NO LOCKS: A CAS-LINKED QUEUE AND A SKIP LIST</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Both drawn from the live structures, read with reflection on JDK 21 (--add-opens java.base/java.util.concurrent).</text>
  <rect x="80" y="160" width="1040" height="250" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">ConcurrentLinkedQueue after offer(T1), offer(T2), offer(T3)</text>
  <text x="100" y="216" fill="#888888" font-family="Arial, sans-serif" font-size="13">volatile Node head, tail; Node(volatile item, volatile next) = 24 bytes; CAS through VarHandles HEAD, TAIL, ITEM, NEXT</text>
  <rect x="110" y="240" width="120" height="50" rx="8" fill="#1A1A1A" stroke="#555555" stroke-width="1.5"/>
  <text x="124" y="270" fill="#999999" font-family="Arial, sans-serif" font-size="14">n0  item null</text>
  <path d="M230 265H276" stroke="#777777" stroke-width="1.5"/>
  <path d="M268 260L278 265L268 270" stroke="#777777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="280" y="240" width="120" height="50" rx="8" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="294" y="270" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">n1  item T1</text>
  <path d="M400 265H446" stroke="#777777" stroke-width="1.5"/>
  <path d="M438 260L448 265L438 270" stroke="#777777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="240" width="120" height="50" rx="8" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="464" y="270" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">n2  item T2</text>
  <path d="M570 265H616" stroke="#777777" stroke-width="1.5"/>
  <path d="M608 260L618 265L608 270" stroke="#777777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="620" y="240" width="120" height="50" rx="8" fill="#21180F" stroke="#FB923C" stroke-width="1.5"/>
  <text x="634" y="270" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">n3  item T3</text>
  <text x="140" y="314" fill="#60A5FA" font-family="Arial, sans-serif" font-size="13">head</text>
  <text x="480" y="314" fill="#FB923C" font-family="Arial, sans-serif" font-size="13">tail (one node behind)</text>
  <text x="650" y="314" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">real last node</text>
  <rect x="850" y="240" width="120" height="50" rx="8" fill="#1A1A1A" stroke="#555555" stroke-width="1.5"/>
  <text x="864" y="270" fill="#999999" font-family="Arial, sans-serif" font-size="14">old head</text>
  <path d="M970 255C1010 235 1010 295 970 280" stroke="#FB923C" stroke-width="1.5"/>
  <path d="M980 276L970 280L978 288" stroke="#FB923C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="314" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">after poll: next = itself</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#BBBBBB">
    <text x="100" y="350">offer: CAS(last.next, null, node); move tail with a weak CAS only when it lags (every 2nd offer)</text>
    <text x="100" y="372">poll: CAS(item, x, null); move head lazily; setRelease(oldHead.next, oldHead) so stale walkers restart from head</text>
    <text x="100" y="394">size(): walks every node, O(n): 3.2 to 4.4 ms at 1,000,000 elements; isEmpty() checks the first live node (2 to 7 ns)</text>
  </g>
  <rect x="80" y="440" width="1040" height="460" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="474" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">ConcurrentSkipListMap with keys 10, 20 ... 320: the index levels of one real run</text>
  <text x="100" y="496" fill="#888888" font-family="Arial, sans-serif" font-size="13">Index(node, down, right) towers; 1 in 4 new keys gets level 1, then each extra level with probability 1/2 (read with reflection)</text>
  <text x="92" y="558" fill="#777777" font-family="Arial, sans-serif" font-size="12">level 3</text>
