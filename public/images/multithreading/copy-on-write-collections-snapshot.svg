<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">COPY ON WRITE: WRITERS COPY, READERS NEVER WAIT</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Fields from javap -p on JDK 21. Costs measured with set() on a list of Integer, best of 5, one busy 8-core machine.</text>

  <!-- LEFT: the list and its arrays -->
  <rect x="80" y="160" width="560" height="420" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">CopyOnWriteArrayList&lt;String&gt; zones</text>

  <rect x="100" y="214" width="250" height="44" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="116" y="242" fill="#FFFFFF" font-family="Courier New, monospace" font-size="15">final Object lock</text>
  <rect x="100" y="270" width="250" height="44" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="116" y="298" fill="#FFFFFF" font-family="Courier New, monospace" font-size="15">volatile Object[] array</text>

  <text x="378" y="242" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">add/set/remove: synchronized (lock)</text>
  <text x="378" y="262" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">(a ReentrantLock in Java 8)</text>

  <!-- new array -->
  <text x="240" y="352" fill="#60A5FA" font-family="Arial, sans-serif" font-size="13">current array, length 3 (new readers start here)</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="100" y="366" width="150" height="40" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/><text x="118" y="391" fill="#FFFFFF">SALT-LAKE</text>
    <rect x="250" y="366" width="150" height="40" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/><text x="272" y="391" fill="#FFFFFF">NEW-TOWN</text>
    <rect x="400" y="366" width="150" height="40" fill="#21180F" stroke="#FB923C" stroke-width="2"/><text x="414" y="391" fill="#FFFFFF">PARK-STREET</text>
  </g>
  <path d="M225 314V362" stroke="#60A5FA" stroke-width="2"/>
  <path d="M220 354L225 364L230 354" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- old array -->
  <text x="100" y="452" fill="#888888" font-family="Arial, sans-serif" font-size="13">old array, length 2: never modified, garbage once no iterator holds it</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="100" y="462" width="150" height="40" fill="#1A1A1A" stroke="#555555" stroke-width="1.5"/><text x="118" y="487" fill="#BBBBBB">SALT-LAKE</text>
    <rect x="250" y="462" width="150" height="40" fill="#1A1A1A" stroke="#555555" stroke-width="1.5"/><text x="272" y="487" fill="#BBBBBB">NEW-TOWN</text>
  </g>
  <rect x="430" y="462" width="190" height="40" rx="8" fill="#0F1A21" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="444" y="487" fill="#93B4D6" font-family="Arial, sans-serif" font-size="13">iterator: snapshot</text>
  <path d="M430 482H404" stroke="#60A5FA" stroke-width="2"/>
  <path d="M412 477L402 482L412 487" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g xml:space="preserve" font-family="Courier New, monospace" font-size="13" fill="#C6A17A">
    <text x="100" y="536">add(e): lock; es = copyOf(array, n + 1);</text>
    <text x="100" y="556">              es[n] = e; array = es; unlock</text>
  </g>

  <!-- RIGHT: what a write costs -->
  <rect x="670" y="160" width="450" height="420" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="690" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">One write copies the whole array</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="690" y="230" fill="#888888">elements</text><text x="820" y="230" fill="#888888">time per write</text><text x="980" y="230" fill="#888888">bytes copied</text>
    <path d="M690 240H1100" stroke="#2B2B2B" stroke-width="1.5"/>
    <text x="690" y="266" fill="#FFFFFF">10</text><text x="820" y="266" fill="#FFFFFF">31 to 34 ns</text><text x="980" y="266" fill="#FFFFFF">56 B</text>
    <text x="690" y="294" fill="#FFFFFF">1,000</text><text x="820" y="294" fill="#FFFFFF">0.4 to 0.5 us</text><text x="980" y="294" fill="#FFFFFF">4 KB</text>
    <text x="690" y="322" fill="#FFFFFF">100,000</text><text x="820" y="322" fill="#FFFFFF">41 to 57 us</text><text x="980" y="322" fill="#FFFFFF">400 KB</text>
    <text x="690" y="350" fill="#FB923C">1,000,000</text><text x="820" y="350" fill="#FB923C">3.1 to 3.8 ms</text><text x="980" y="350" fill="#FB923C">4 MB</text>
  </g>
  <text x="690" y="378" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">4 MB Object[] is humongous in G1 (1 MB regions), never</text>
  <text x="690" y="396" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">eagerly reclaimed: 2,000 writes cost 14 full GCs, 5.5 s in GC</text>

  <path d="M690 420H1100" stroke="#2B2B2B" stroke-width="1.5"/>
  <text x="690" y="448" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">7 readers iterating 50 elements, 1 writer every 1 ms</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="690" y="462" width="400" height="22" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="700" y="478" fill="#FFFFFF">CopyOnWriteArrayList 13.4 M iterations/s</text>
    <rect x="690" y="494" width="50" height="22" fill="#1A1A1A" stroke="#555555" stroke-width="1.5"/>
    <text x="752" y="510" fill="#BBBBBB">synchronizedList 1.7 to 3.4 M</text>
    <rect x="690" y="526" width="50" height="22" fill="#1A1A1A" stroke="#555555" stroke-width="1.5"/>
    <text x="752" y="542" fill="#BBBBBB">ReentrantReadWriteLock 1.8 to 3.2 M</text>
  </g>

  <!-- BOTTOM: rules -->
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="80" y="610" width="340" height="150" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="100" y="640" fill="#FFFFFF">Iterators</text>
    <text x="100" y="666" fill="#93B4D6">never throw ConcurrentModificationException</text>
    <text x="100" y="688" fill="#93B4D6">see the list as it was when created</text>
    <text x="100" y="710" fill="#93B4D6">remove, set, add: UnsupportedOperation</text>
    <text x="100" y="732" fill="#93B4D6">subList DOES throw CME after a write</text>

    <rect x="430" y="610" width="340" height="150" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="450" y="640" fill="#FFFFFF">Compound actions</text>
    <text x="450" y="666" fill="#C6A17A">contains + add: 264 to 2,261 duplicates</text>
    <text x="450" y="688" fill="#C6A17A">addIfAbsent: 0 (re-checks under the lock)</text>
    <text x="450" y="710" fill="#C6A17A">clear + addAll: readers saw an empty list</text>
    <text x="450" y="732" fill="#C6A17A">fix: build aside, publish one reference</text>

    <rect x="780" y="610" width="340" height="150" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
    <text x="800" y="640" fill="#FFFFFF">CopyOnWriteArraySet</text>
    <text x="800" y="666" fill="#BBBBBB">a CopyOnWriteArrayList inside</text>
    <text x="800" y="688" fill="#BBBBBB">add = addIfAbsent: O(n) scan + copy</text>
    <text x="800" y="710" fill="#BBBBBB">30,000 ids twice: 1.3 to 1.4 s vs 4 to 8 ms</text>
    <text x="800" y="732" fill="#BBBBBB">for ConcurrentHashMap.newKeySet()</text>
  </g>
</svg>
