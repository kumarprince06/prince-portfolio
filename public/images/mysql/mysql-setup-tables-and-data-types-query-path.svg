<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="900" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">THE PATH OF ONE QUERY THROUGH MYSQL 8.0</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">MySQL 8.0.45 in Docker, ride_hailing.trips with 300,001 rows; numbers from performance_schema and SHOW STATUS</text>

  <!-- row 1: client, connection thread, parser, resolver -->
  <rect x="80" y="160" width="240" height="160" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="98" y="190" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">1. Client</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="98" y="218" fill="#93B4D6">JDBC driver or mysql</text>
    <text x="98" y="238" fill="#93B4D6">sends the SQL as text</text>
    <text x="98" y="258" fill="#93B4D6">(a COM_QUERY packet)</text>
  </g>
  <text x="98" y="290" fill="#888888" font-family="Arial, sans-serif" font-size="13">TCP port 3306 or a Unix socket</text>

  <rect x="346" y="160" width="240" height="160" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="364" y="190" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">2. Connection thread</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="364" y="218" fill="#93B4D6">one_connection thread</text>
    <text x="364" y="238" fill="#93B4D6">per client session</text>
    <text x="364" y="258" fill="#C6A17A">Threads_connected = 3</text>
  </g>
  <text x="364" y="290" fill="#888888" font-family="Arial, sans-serif" font-size="13">26 connections, 3 threads created</text>
  <text x="364" y="308" fill="#888888" font-family="Arial, sans-serif" font-size="13">(the thread cache reuses them)</text>

  <rect x="612" y="160" width="240" height="160" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="630" y="190" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">3. Parser</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="630" y="218" fill="#93B4D6">SQL text → parse tree</text>
    <text x="630" y="238" fill="#C6A17A">SELEKT → ERROR 1064</text>
  </g>
  <text x="630" y="290" fill="#888888" font-family="Arial, sans-serif" font-size="13">grammar only: it knows</text>
  <text x="630" y="308" fill="#888888" font-family="Arial, sans-serif" font-size="13">nothing about your tables</text>

  <rect x="878" y="160" width="242" height="160" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="896" y="190" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">4. Resolve and check</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="896" y="218" fill="#93B4D6">names → real objects</text>
    <text x="896" y="238" fill="#C6A17A">fair  → ERROR 1054</text>
    <text x="896" y="258" fill="#C6A17A">tripz → ERROR 1146</text>
  </g>
  <text x="896" y="290" fill="#888888" font-family="Arial, sans-serif" font-size="13">stages: checking permissions,</text>
  <text x="896" y="308" fill="#888888" font-family="Arial, sans-serif" font-size="13">Opening tables (173 µs)</text>

  <g stroke="#60A5FA" stroke-width="2">
    <path d="M320 240H346"/><path d="M586 240H612"/><path d="M852 240H878"/>
    <path d="M999 320V350"/>
  </g>
  <g stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M337 235L346 240L337 245"/><path d="M603 235L612 240L603 245"/><path d="M869 235L878 240L869 245"/>
    <path d="M994 341L999 350L1004 341"/>
  </g>

  <!-- row 2: optimizer, executor, handler API -->
  <rect x="878" y="350" width="242" height="160" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="896" y="380" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">5. Optimizer</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="896" y="408" fill="#C6A17A">id = 4242: const,</text>
    <text x="896" y="428" fill="#C6A17A">row read while planning</text>
    <text x="896" y="448" fill="#C6A17A">zone = HOWRAH: Table</text>
    <text x="896" y="468" fill="#C6A17A">scan, est. 29,855 rows</text>
  </g>
  <text x="896" y="496" fill="#888888" font-family="Arial, sans-serif" font-size="13">EXPLAIN, optimizer_trace</text>

  <rect x="612" y="350" width="240" height="160" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="630" y="380" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">6. Executor</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="630" y="408" fill="#C6A17A">Table scan → Filter</text>
    <text x="630" y="428" fill="#C6A17A">→ Aggregate</text>
    <text x="630" y="448" fill="#C6A17A">60,000 rows matched</text>
  </g>
  <text x="630" y="478" fill="#888888" font-family="Arial, sans-serif" font-size="13">pulls rows one at a time and</text>
  <text x="630" y="496" fill="#888888" font-family="Arial, sans-serif" font-size="13">evaluates WHERE on each</text>

  <rect x="346" y="350" width="240" height="160" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="364" y="380" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">7. Storage engine API</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="364" y="408" fill="#C6A17A">scan: rnd_next ×300,002</text>
    <text x="364" y="428" fill="#C6A17A">by id: read_key ×1</text>
  </g>
  <text x="364" y="460" fill="#888888" font-family="Arial, sans-serif" font-size="13">the handler interface: the same</text>
  <text x="364" y="478" fill="#888888" font-family="Arial, sans-serif" font-size="13">calls for every engine (Handler_*</text>
  <text x="364" y="496" fill="#888888" font-family="Arial, sans-serif" font-size="13">counters in SHOW STATUS)</text>

  <rect x="80" y="350" width="240" height="160" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="98" y="380" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">8. Result to the client</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="98" y="408" fill="#93B4D6">60000 | 11996400.00</text>
  </g>
  <text x="98" y="440" fill="#888888" font-family="Arial, sans-serif" font-size="13">Com_select +1 per SELECT</text>
  <text x="98" y="458" fill="#888888" font-family="Arial, sans-serif" font-size="13">0.17 s cold, 0.14 s warm</text>

  <g stroke="#FB923C" stroke-width="2">
    <path d="M878 430H852"/><path d="M612 430H586"/><path d="M346 430H320"/>
    <path d="M466 510V560"/>
  </g>
  <g stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M861 425L852 430L861 435"/><path d="M595 425L586 430L595 435"/><path d="M329 425L320 430L329 435"/>
    <path d="M461 551L466 560L471 551"/>
  </g>

  <!-- row 3: InnoDB buffer pool and disk -->
  <rect x="80" y="560" width="640" height="190" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="98" y="590" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">9. InnoDB buffer pool: 16 KB pages cached in memory (64 MB here)</text>
  <g font-family="Courier New, monospace" font-size="13">
    <text x="330" y="622" fill="#93B4D6">read_requests</text>
    <text x="440" y="622" fill="#93B4D6">reads</text>
    <text x="520" y="622" fill="#93B4D6">read_ahead</text>
    <text x="620" y="622" fill="#93B4D6">pages_read</text>
    <text x="98" y="646" fill="#C6A17A">cold scan (restart)</text>
    <text x="330" y="646" fill="#C6A17A">+4,168</text>
    <text x="440" y="646" fill="#C6A17A">+99</text>
    <text x="520" y="646" fill="#C6A17A">+1,664</text>
    <text x="620" y="646" fill="#C6A17A">+1,763</text>
    <text x="98" y="670" fill="#C6A17A">same scan again</text>
    <text x="330" y="670" fill="#C6A17A">+2,338</text>
    <text x="440" y="670" fill="#C6A17A">+0</text>
    <text x="520" y="670" fill="#C6A17A">+0</text>
    <text x="620" y="670" fill="#C6A17A">+0</text>
  </g>
  <text x="98" y="704" fill="#888888" font-family="Arial, sans-serif" font-size="13">read_requests = logical page reads (memory); reads = pages that had to come from disk.</text>
  <text x="98" y="724" fill="#888888" font-family="Arial, sans-serif" font-size="13">After the first scan, 1,708 pages of trips sat in the pool (INNODB_BUFFER_PAGE).</text>

  <path d="M720 655H760" stroke="#60A5FA" stroke-width="2"/>
  <path d="M751 650L760 655L751 660" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M729 670L720 675L729 680" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M720 675H760" stroke="#60A5FA" stroke-width="2"/>

  <rect x="760" y="560" width="360" height="190" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="778" y="590" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">10. Disk: ride_hailing/trips.ibd</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="778" y="620" fill="#93B4D6">62,914,560 bytes = 3,840 pages</text>
    <text x="778" y="642" fill="#93B4D6">page 0 FSP_HDR, 1 IBUF_BITMAP,</text>
    <text x="778" y="664" fill="#93B4D6">2 INODE, 3 SDI (the table's</text>
    <text x="778" y="686" fill="#93B4D6">definition, as JSON)</text>
    <text x="778" y="708" fill="#C6A17A">4 PRIMARY root: 1 + 3 + 1,706</text>
  </g>
  <text x="778" y="734" fill="#888888" font-family="Arial, sans-serif" font-size="13">one .ibd per table, no .frm since 8.0</text>

  <!-- stages -->
  <rect x="80" y="776" width="1040" height="96" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="98" y="802" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">Stages of SELECT fare FROM trips WHERE id = 4242 (events_stages_history_long, 334 µs in all):</text>
  <text x="98" y="828" fill="#888888" font-family="Courier New, monospace" font-size="13">starting → checking permissions → Opening tables → init → System lock → optimizing</text>
  <text x="98" y="852" fill="#888888" font-family="Courier New, monospace" font-size="13">→ statistics → preparing → executing → end → query end → closing tables → cleaning up</text>
</svg>
