<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="640" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">ONE STRING IS TWO OBJECTS: COMPACT STRINGS</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">JDK 21 defaults. Offsets from StringLayout.java, sizes from CompactSize.java (ThreadMXBean).</text>

  <!-- String object offsets -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#888888">
    <text x="80" y="170">0</text>
    <text x="340" y="170">8</text>
    <text x="500" y="170">12</text>
    <text x="660" y="170">16</text>
    <text x="760" y="170">17</text>
    <text x="880" y="170">18</text>
    <text x="940" y="170">20</text>
    <text x="1104" y="170">24</text>
  </g>

  <rect x="80" y="182" width="260" height="96" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="98" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">mark word</text>
  <text x="98" y="248" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">8 bytes</text>

  <rect x="340" y="182" width="160" height="96" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="355" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">class pointer</text>
  <text x="355" y="248" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">4 bytes</text>

  <rect x="500" y="182" width="160" height="96" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="515" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">int hash</text>
  <text x="515" y="248" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">0 until hashCode()</text>

  <rect x="660" y="182" width="100" height="96" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="672" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">coder</text>
  <text x="672" y="248" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">0 or 1</text>

  <rect x="760" y="182" width="120" height="96" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="772" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">hashIsZero</text>
  <text x="772" y="248" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">boolean</text>

  <rect x="880" y="182" width="60" height="96" rx="10" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="892" y="236" fill="#777777" font-family="Arial, sans-serif" font-size="14">gap</text>

  <rect x="940" y="182" width="180" height="96" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="955" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">byte[] value</text>
  <text x="955" y="248" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">reference · 4 bytes</text>

  <text x="80" y="306" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">The String object is always 24 bytes, whatever the length of the text.</text>

  <!-- arrows from value to the two arrays -->
  <path d="M1000 278V318H330V350" stroke="#60A5FA" stroke-width="2"/>
  <path d="M325 341L330 350L335 341" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1060 278V350" stroke="#60A5FA" stroke-width="2"/>
  <path d="M1055 341L1060 350L1065 341" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="604" y="342" fill="#93B4D6" font-family="Arial, sans-serif" font-size="13">either one, chosen when the String is created</text>

  <!-- Latin-1 array -->
  <rect x="80" y="360" width="500" height="230" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="392" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">"Hello Kolkata"  ·  coder 0, LATIN1</text>
  <text x="100" y="416" fill="#888888" font-family="Arial, sans-serif" font-size="14">every char fits in one byte</text>
  <rect x="100" y="436" width="90" height="44" rx="6" fill="#21180F" stroke="#FB923C" stroke-width="1.5"/>
  <text x="112" y="463" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">header 16</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">
    <rect x="190" y="436" width="338" height="44" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
    <path d="M216 436V480M242 436V480M268 436V480M294 436V480M320 436V480M346 436V480M372 436V480M398 436V480M424 436V480M450 436V480M476 436V480M502 436V480" stroke="#60A5FA" stroke-width="1"/>
    <text x="198" y="463">H</text><text x="225" y="463">e</text><text x="252" y="463">l</text><text x="278" y="463">l</text><text x="302" y="463">o</text>
    <text x="355" y="463">K</text><text x="380" y="463">o</text><text x="408" y="463">l</text><text x="432" y="463">k</text><text x="458" y="463">a</text><text x="486" y="463">t</text><text x="510" y="463">a</text>
  </g>
  <rect x="528" y="436" width="32" height="44" rx="4" fill="#151515" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="100" y="516" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">byte[]: 16 + 13 = 29, padded to 32 bytes</text>
  <text x="100" y="544" fill="#FB923C" font-family="Arial, sans-serif" font-size="16">String + array: 56 bytes</text>
  <text x="100" y="570" fill="#777777" font-family="Arial, sans-serif" font-size="14">with -XX:-CompactStrings: 72 bytes</text>

  <!-- UTF-16 array -->
  <rect x="620" y="360" width="500" height="230" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="640" y="392" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">"Price ₹120.00"  ·  coder 1, UTF16</text>
  <text x="640" y="416" fill="#888888" font-family="Arial, sans-serif" font-size="14">one char (U+20B9) needs two bytes, so all do</text>
  <rect x="640" y="436" width="80" height="44" rx="6" fill="#21180F" stroke="#FB923C" stroke-width="1.5"/>
  <text x="650" y="463" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">header 16</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF">
    <rect x="720" y="436" width="364" height="44" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
    <path d="M748 436V480M776 436V480M804 436V480M832 436V480M860 436V480M888 436V480M916 436V480M944 436V480M972 436V480M1000 436V480M1028 436V480M1056 436V480" stroke="#60A5FA" stroke-width="1"/>
    <path d="M734 470V480M762 470V480M790 470V480M818 470V480M846 470V480M874 470V480M902 470V480M930 470V480M958 470V480M986 470V480M1014 470V480M1042 470V480M1070 470V480" stroke="#60A5FA" stroke-width="1"/>
    <text x="729" y="462">P</text><text x="758" y="462">r</text><text x="787" y="462">i</text><text x="813" y="462">c</text><text x="841" y="462">e</text>
    <rect x="888" y="436" width="28" height="44" fill="#21180F" stroke="#FB923C" stroke-width="1.5"/>
    <text x="896" y="462" fill="#FB923C">₹</text>
    <text x="924" y="462">1</text><text x="952" y="462">2</text><text x="980" y="462">0</text><text x="1010" y="462">.</text><text x="1036" y="462">0</text><text x="1064" y="462">0</text>
  </g>
  <rect x="1084" y="436" width="20" height="44" rx="4" fill="#151515" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="640" y="516" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">byte[]: 16 + 26 = 42, padded to 48 bytes</text>
  <text x="640" y="544" fill="#FB923C" font-family="Arial, sans-serif" font-size="16">String + array: 72 bytes</text>
  <text x="640" y="570" fill="#777777" font-family="Arial, sans-serif" font-size="14">same 72 bytes with compaction turned off</text>
</svg>
