<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">REWRITING IN PLACE VS WRITE A TEMP FILE AND RENAME</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">A 16.5 KB fare table rewritten every few ms while a reader reloads it for 2 seconds (FareReload.java, JDK 21, Linux).</text>

  <!-- top lane: in place -->
  <text x="80" y="172" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">In place: Files.newBufferedWriter(fares.csv)</text>
  <g font-family="Courier New, monospace" font-size="13">
    <rect x="80" y="192" width="230" height="64" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="96" y="218" fill="#FFFFFF">openat(O_TRUNC)</text>
    <text x="96" y="240" fill="#C6A17A">file is now 0 bytes</text>
    <rect x="330" y="192" width="200" height="64" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="346" y="218" fill="#FFFFFF">write(8192)</text>
    <text x="346" y="240" fill="#C6A17A">ends mid-row</text>
    <rect x="550" y="192" width="200" height="64" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="566" y="218" fill="#FFFFFF">write(8192)</text>
    <text x="566" y="240" fill="#C6A17A">ends mid-row</text>
    <rect x="770" y="192" width="200" height="64" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="786" y="218" fill="#FFFFFF">write(tail)</text>
    <text x="786" y="240" fill="#C6A17A">complete again</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#888888">
    <text x="80" y="282">reader sees: empty file</text>
    <text x="330" y="282">reader sees: torn last row</text>
    <text x="550" y="282">reader sees: torn last row</text>
    <text x="770" y="282">reader sees: the full table</text>
  </g>
  <rect x="80" y="302" width="1040" height="96" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="334" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">Measured: 62,948 reloads: 37,980 complete, 23,469 empty, 1,494 with a torn last row</text>
  <text x="100" y="360" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14">123 torn rows still parsed as a fare:</text>
  <text x="338" y="360" fill="#C6A17A" font-family="Courier New, monospace" font-size="14">DUM-DUM,RAJARHAT,CAB-XL,2</text>
  <text x="100" y="384" fill="#888888" font-family="Arial, sans-serif" font-size="13">a 2-paise cab fare, from a row whose last digits had not been written yet</text>

  <!-- bottom lane: atomic -->
  <text x="80" y="452" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">Atomic: write fares.csv.tmp in the same directory, fsync, then rename</text>
  <g font-family="Courier New, monospace" font-size="13">
    <rect x="80" y="472" width="300" height="64" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
    <text x="96" y="498" fill="#FFFFFF">write fares.csv.tmp</text>
    <text x="96" y="520" fill="#93B4D6">nobody reads this name</text>
    <rect x="400" y="472" width="200" height="64" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
    <text x="416" y="498" fill="#FFFFFF">fsync(tmp)</text>
    <text x="416" y="520" fill="#93B4D6">ch.force(true)</text>
    <rect x="620" y="472" width="500" height="64" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
    <text x="636" y="498" fill="#FFFFFF">rename("fares.csv.tmp", "fares.csv")</text>
    <text x="636" y="520" fill="#93B4D6">Files.move(tmp, fares, ATOMIC_MOVE)</text>
  </g>

  <!-- directory entry swap -->
  <text x="80" y="580" fill="#888888" font-family="Arial, sans-serif" font-size="13">The directory entry "fares.csv" points at one complete inode, then at another. There is no moment in between.</text>
  <g font-family="Arial, sans-serif" font-size="14">
    <rect x="80" y="596" width="180" height="52" rx="8" fill="#151515" stroke="#444444" stroke-width="1.5"/>
    <text x="96" y="628" fill="#FFFFFF">fares.csv</text>
    <path d="M260 622H330" stroke="#60A5FA" stroke-width="2"/>
    <path d="M321 617L330 622L321 627" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="330" y="596" width="260" height="52" rx="8" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="346" y="628" fill="#FFFFFF">inode A: old table, complete</text>
    <path d="M600 622H660" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="606" y="610" fill="#888888" font-size="12">rename</text>
    <rect x="660" y="596" width="260" height="52" rx="8" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="676" y="628" fill="#FFFFFF">inode B: new table, complete</text>
  </g>
  <text x="940" y="616" fill="#888888" font-family="Arial, sans-serif" font-size="13">readers already open on A</text>
  <text x="940" y="634" fill="#888888" font-family="Arial, sans-serif" font-size="13">keep reading A to the end</text>

  <text x="80" y="690" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">Measured: 34,890 reloads, 34,890 complete. Same directory matters: across file systems rename fails with EXDEV,</text>
  <text x="80" y="714" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">and Files.move with ATOMIC_MOVE throws AtomicMoveNotSupportedException instead of copying.</text>
</svg>
