<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">ONE TRY-CATCH-FINALLY IN THE CLASS FILE</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">FinallyCopies.parse(String) on JDK 21, javap -c, grouped by what each run of bytecode does</text>

  <!-- left: bytecode blocks -->
  <g font-family="Arial, sans-serif">
    <text x="80" y="168" fill="#888888" font-size="14">OFFSETS</text>
    <text x="200" y="168" fill="#888888" font-size="14">BYTECODE</text>

    <rect x="80" y="182" width="560" height="72" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
    <text x="100" y="213" fill="#FFFFFF" font-size="17">0 – 4</text>
    <text x="200" y="213" fill="#FFFFFF" font-size="17">try body</text>
    <text x="200" y="238" fill="#93B4D6" font-size="14">aload_0 · invokestatic parseInt · istore_1 (save the value)</text>

    <rect x="80" y="266" width="560" height="72" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="100" y="297" fill="#FFFFFF" font-size="17">5 – 14</text>
    <text x="200" y="297" fill="#FFFFFF" font-size="17">finally, copy 1 · then return</text>
    <text x="200" y="322" fill="#C6A17A" font-size="14">println("cleanup") · iload_1 · ireturn</text>

    <rect x="80" y="350" width="560" height="72" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
    <text x="100" y="381" fill="#FFFFFF" font-size="17">15 – 17</text>
    <text x="200" y="381" fill="#FFFFFF" font-size="17">catch (NumberFormatException e)</text>
    <text x="200" y="406" fill="#93B4D6" font-size="14">astore_1 (e) · iconst_m1 · istore_2 (save -1)</text>

    <rect x="80" y="434" width="560" height="72" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="100" y="465" fill="#FFFFFF" font-size="17">18 – 27</text>
    <text x="200" y="465" fill="#FFFFFF" font-size="17">finally, copy 2 · then return</text>
    <text x="200" y="490" fill="#C6A17A" font-size="14">println("cleanup") · iload_2 · ireturn</text>

    <rect x="80" y="518" width="560" height="72" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
    <text x="100" y="549" fill="#FFFFFF" font-size="17">28 – 38</text>
    <text x="200" y="549" fill="#FFFFFF" font-size="17">any handler: finally, copy 3 · rethrow</text>
    <text x="200" y="574" fill="#C6A17A" font-size="14">astore_3 · println("cleanup") · aload_3 · athrow</text>
  </g>

  <!-- right: exception table -->
  <g font-family="Arial, sans-serif">
    <text x="740" y="168" fill="#888888" font-size="14">EXCEPTION TABLE</text>
    <rect x="740" y="182" width="380" height="240" rx="10" fill="#151515" stroke="#444444" stroke-width="2"/>
    <text x="756" y="214" fill="#AAAAAA" font-size="14">from</text>
    <text x="808" y="214" fill="#AAAAAA" font-size="14">to</text>
    <text x="850" y="214" fill="#AAAAAA" font-size="14">target</text>
    <text x="912" y="214" fill="#AAAAAA" font-size="14">type</text>
    <path d="M752 226H1108" stroke="#2B2B2B" stroke-width="2"/>

    <text x="756" y="262" fill="#FFFFFF" font-size="16">0</text>
    <text x="808" y="262" fill="#FFFFFF" font-size="16">5</text>
    <text x="850" y="262" fill="#FFFFFF" font-size="16">15</text>
    <text x="912" y="262" fill="#93B4D6" font-size="15">NumberFormatException</text>

    <text x="756" y="322" fill="#FFFFFF" font-size="16">0</text>
    <text x="808" y="322" fill="#FFFFFF" font-size="16">5</text>
    <text x="850" y="322" fill="#FFFFFF" font-size="16">28</text>
    <text x="912" y="322" fill="#C6A17A" font-size="15">any</text>

    <text x="756" y="382" fill="#FFFFFF" font-size="16">15</text>
    <text x="808" y="382" fill="#FFFFFF" font-size="16">18</text>
    <text x="850" y="382" fill="#FFFFFF" font-size="16">28</text>
    <text x="912" y="382" fill="#C6A17A" font-size="15">any</text>
  </g>

  <!-- arrows from table rows to targets -->
  <path d="M740 257H700V386H652" stroke="#60A5FA" stroke-width="2"/>
  <path d="M661 381L652 386L661 391" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M740 317H715V546H652" stroke="#FB923C" stroke-width="2"/>
  <path d="M740 377H730V562H652" stroke="#FB923C" stroke-width="2"/>
  <path d="M661 541L652 546L661 551" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M661 557L652 562L661 567" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- notes -->
  <g font-family="Arial, sans-serif">
    <text x="740" y="462" fill="#FFFFFF" font-size="16">Reading a row</text>
    <text x="740" y="490" fill="#888888" font-size="14">from is inclusive, to is exclusive: 0 – 5</text>
    <text x="740" y="512" fill="#888888" font-size="14">covers offsets 0 to 4, the try body.</text>
    <text x="740" y="540" fill="#888888" font-size="14">any is catch_type 0: every throwable.</text>
    <text x="740" y="562" fill="#888888" font-size="14">It is how finally is implemented.</text>

    <text x="80" y="636" fill="#FFFFFF" font-size="17">The same println("cleanup") is compiled three times, once per way out.</text>
    <text x="80" y="666" fill="#888888" font-size="15">The return value is saved in a local before the copy runs, so finally cannot change which value is returned.</text>
    <text x="80" y="692" fill="#888888" font-size="15">Nothing executes on the way into the try: offsets 0 to 14 are the whole normal path, finally included.</text>
  </g>
</svg>
