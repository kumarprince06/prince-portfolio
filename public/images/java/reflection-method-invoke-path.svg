<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">WHAT Method.invoke ACTUALLY RUNS</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">JDK 21 (JEP 416, method handles) on top, JDK 8 to 17 (native, then generated bytecode) below. Frames from StackWalker.</text>

  <!-- call site -->
  <rect x="80" y="160" width="300" height="200" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">Call site (javap -c)</text>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="100" y="230" fill="#FFFFFF">surge.invoke(calc, 10_000L, 25)</text>
    <text x="100" y="262" fill="#C6A17A">anewarray Object      // [2]</text>
    <text x="100" y="284" fill="#C6A17A">Long.valueOf, Integer.valueOf</text>
    <text x="100" y="306" fill="#C6A17A">invokevirtual Method.invoke</text>
    <text x="100" y="328" fill="#C6A17A">checkcast Long, longValue</text>
  </g>

  <!-- JDK 21 path -->
  <path d="M380 260H420" stroke="#FB923C" stroke-width="2"/>
  <path d="M411 255L420 260L411 265" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420" y="160" width="230" height="200" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="440" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">Method.invoke</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#C6A17A">
    <text x="440" y="226">access check (unless</text>
    <text x="440" y="246">setAccessible(true))</text>
    <text x="440" y="278">first call: create the</text>
    <text x="440" y="298">MethodAccessor, store it on</text>
    <text x="440" y="318">the root Method, shared by</text>
    <text x="440" y="338">every copy getMethod returns</text>
  </g>

  <path d="M650 260H690" stroke="#FB923C" stroke-width="2"/>
  <path d="M681 255L690 260L681 265" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="690" y="160" width="230" height="200" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="710" y="194" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">DirectMethodHandle</text>
  <text x="710" y="214" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">Accessor.invoke</text>
  <g font-family="Courier New, monospace" font-size="12" xml:space="preserve">
    <text x="710" y="244" fill="#C6A17A">switch (paramCount)</text>
    <text x="710" y="262" fill="#C6A17A"> case 2:</text>
    <text x="710" y="280" fill="#C6A17A">  target.invokeExact(obj,</text>
    <text x="710" y="298" fill="#C6A17A">    args[0], args[1])</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#888888">
    <text x="710" y="324">target: a MethodHandle</text>
    <text x="710" y="344">adapted to (Object...)Object</text>
  </g>

  <path d="M920 260H960" stroke="#FB923C" stroke-width="2"/>
  <path d="M951 255L960 260L951 265" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="960" y="200" width="160" height="120" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="980" y="234" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">surge(long, int)</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#93B4D6">
    <text x="980" y="262">unbox, call, box</text>
    <text x="980" y="282">the result; a throw</text>
    <text x="980" y="302">is wrapped in ITE</text>
  </g>

  <!-- JDK 8-17 path -->
  <text x="80" y="408" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">Before JDK 18: inflation (still on JDK 21 with -Djdk.reflect.useDirectMethodHandle=false)</text>
  <rect x="80" y="428" width="300" height="104" rx="12" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="100" y="460" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">Calls 1 to 16</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#93B4D6" xml:space="preserve">
    <text x="100" y="486">NativeMethodAccessorImpl</text>
    <text x="100" y="506">  .invoke0  (JNI, slow)</text>
  </g>
  <path d="M380 480H440" stroke="#60A5FA" stroke-width="2"/>
  <path d="M431 475L440 480L431 485" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="440" y="428" width="320" height="104" rx="12" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="460" y="460" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">Call 16 crosses the threshold (15)</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#93B4D6">
    <text x="460" y="486">generate bytecode for this one method,</text>
    <text x="460" y="506">swap it into DelegatingMethodAccessorImpl</text>
  </g>
  <path d="M760 480H820" stroke="#60A5FA" stroke-width="2"/>
  <path d="M811 475L820 480L811 485" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="820" y="428" width="300" height="104" rx="12" fill="#132433" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="840" y="460" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">Call 17 onwards</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#93B4D6" xml:space="preserve">
    <text x="840" y="486">GeneratedMethodAccessor1</text>
    <text x="840" y="506">  .invoke  (a real class)</text>
  </g>

  <!-- measurements -->
  <text x="80" y="582" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">Measured, ns per call (one laptop, best of 7, not JMH)</text>
  <g font-family="Courier New, monospace" font-size="14" xml:space="preserve">
    <text x="80" y="614" fill="#C6A17A">direct call                    0.57     static final Method.invoke     0.58</text>
    <text x="80" y="640" fill="#C6A17A">static final MethodHandle      0.54     Method in a non-final field    9.5  (JDK 17: 2.2)</text>
    <text x="80" y="666" fill="#C6A17A">non-final MethodHandle         4.9      getMethod + invoke every call  38 to 100</text>
  </g>
  <text x="80" y="700" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">Look the Method up once and keep it; a constant Method lets the JIT inline straight through the handle.</text>
</svg>
