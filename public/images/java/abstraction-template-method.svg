<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">THE TEMPLATE METHOD IN THE PAYMENT GATEWAY</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">charge() is final: the base class owns the order of the steps, each provider owns one step.</text>

  <!-- base class container -->
  <text x="80" y="170" fill="#888888" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">BASE CLASS · AbstractPaymentGateway.charge(request) · final</text>
  <rect x="80" y="185" width="600" height="485" rx="16" fill="#120F0C" stroke="#FB923C" stroke-width="2"/>

  <!-- step 1 -->
  <rect x="110" y="210" width="540" height="58" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="130" y="236" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">1  validate the amount</text>
  <text x="130" y="257" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">0 &lt; amount &lt;= Rs 5,000, otherwise REJECTED</text>

  <!-- step 2 -->
  <rect x="110" y="284" width="540" height="58" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="130" y="310" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">2  idempotency check</text>
  <text x="130" y="331" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">key seen before? REJECTED duplicate, provider never called</text>

  <!-- step 3: the abstract step -->
  <rect x="110" y="358" width="540" height="58" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="130" y="384" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">3  doCharge(request) · abstract</text>
  <text x="130" y="405" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">the provider call, the only step a subclass must write</text>

  <!-- retry loop -->
  <path d="M110 400C84 400 84 374 102 374" stroke="#FB923C" stroke-width="2"/>
  <path d="M95 369L104 374L95 379" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="130" y="428" width="520" height="34" rx="8" fill="#151515" stroke="#444444" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="146" y="450" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="14">TransientGatewayException: retry while attempt &lt; maxAttempts()  (hook, 3)</text>

  <!-- step 4 -->
  <rect x="110" y="478" width="540" height="50" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="130" y="502" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">4  record metrics</text>
  <text x="300" y="502" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">a counter for every outcome, read by metrics()</text>

  <!-- step 5: hook -->
  <rect x="110" y="540" width="540" height="50" rx="10" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="130" y="564" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="17">5  onCharged(request, ref)</text>
  <text x="355" y="564" fill="#777777" font-family="Arial, sans-serif" font-size="14">hook: a no-op unless overridden</text>

  <!-- step 6 -->
  <rect x="110" y="602" width="540" height="50" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="130" y="626" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">6  log and return the outcome</text>
  <text x="385" y="626" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">CHARGED, REJECTED or FAILED</text>

  <!-- flow arrows between steps -->
  <path d="M380 268V282" stroke="#FB923C" stroke-width="2"/>
  <path d="M380 342V356" stroke="#FB923C" stroke-width="2"/>
  <path d="M380 462V476" stroke="#FB923C" stroke-width="2"/>
  <path d="M380 528V538" stroke="#FB923C" stroke-width="2"/>
  <path d="M380 590V600" stroke="#FB923C" stroke-width="2"/>

  <!-- subclasses -->
  <text x="760" y="170" fill="#888888" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">SUBCLASSES · implement doCharge()</text>

  <rect x="760" y="210" width="360" height="96" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="780" y="242" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">RazorpayGateway</text>
  <text x="780" y="268" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">doCharge() returns a "pay_" reference</text>
  <text x="780" y="290" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">simulated, succeeds first time</text>

  <rect x="760" y="330" width="360" height="96" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="780" y="362" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">StripeGateway</text>
  <text x="780" y="388" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">first call throws "503 from provider",</text>
  <text x="780" y="410" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">the retry returns a "ch_" reference</text>

  <rect x="760" y="450" width="360" height="96" rx="10" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="780" y="482" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="17">WalletGateway (a third provider)</text>
  <text x="780" y="508" fill="#777777" font-family="Arial, sans-serif" font-size="14">one new class: name() and doCharge(),</text>
  <text x="780" y="530" fill="#777777" font-family="Arial, sans-serif" font-size="14">optionally maxAttempts() returns 1</text>

  <!-- arrows from doCharge to implementations -->
  <path d="M650 387C705 387 700 258 752 258" stroke="#60A5FA" stroke-width="2"/>
  <path d="M744 253L753 258L744 263" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M650 387C705 387 705 378 752 378" stroke="#60A5FA" stroke-width="2"/>
  <path d="M744 373L753 378L744 383" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M650 387C705 387 700 498 752 498" stroke="#444444" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M744 493L753 498L744 503" stroke="#444444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- what subclasses cannot do -->
  <text x="760" y="590" fill="#888888" font-family="Arial, sans-serif" font-size="14">A subclass cannot skip steps 1, 2, 4 or 6:</text>
  <text x="760" y="613" fill="#888888" font-family="Arial, sans-serif" font-size="14">overriding charge() is a compile error,</text>
  <text x="760" y="636" fill="#888888" font-family="Arial, sans-serif" font-size="14">"overridden method is final".</text>

  <!-- legend -->
  <rect x="80" y="698" width="18" height="18" rx="4" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="108" y="712" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="14">owned by the base class</text>
  <rect x="300" y="698" width="18" height="18" rx="4" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="328" y="712" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="14">owned by each subclass (abstract)</text>
  <rect x="580" y="698" width="18" height="18" rx="4" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="608" y="712" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="14">hook or optional: has a default, may be overridden</text>
</svg>
