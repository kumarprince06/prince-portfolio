<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">WHO CAN SEE A MEMBER OF PRODUCT</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Each ring adds code that can see one more access level. Classes from the two-package program in this lesson.</text>

  <!-- public ring -->
  <rect x="80" y="160" width="1040" height="570" rx="22" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="104" y="192" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="16">public: any class anywhere (across modules only if the package is exported)</text>

  <!-- protected ring -->
  <rect x="110" y="212" width="770" height="490" rx="20" fill="#0F1A21" stroke="#60A5FA" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="134" y="244" fill="#93B4D6" font-family="Arial, sans-serif" font-size="16">protected: the package, plus subclasses in other packages</text>

  <!-- package ring -->
  <rect x="140" y="264" width="440" height="410" rx="18" fill="#132433" stroke="#60A5FA" stroke-width="2"/>
  <text x="162" y="296" fill="#93B4D6" font-family="Arial, sans-serif" font-size="16">package-private: every class in package shop</text>

  <!-- the class -->
  <rect x="166" y="316" width="388" height="208" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="188" y="350" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">shop.Product</text>
  <text x="188" y="380" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">private long costPaise</text>
  <text x="188" y="404" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">int stock</text>
  <text x="188" y="428" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">protected long pricePaise</text>
  <text x="188" y="452" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">public String name</text>
  <path d="M188 472H532" stroke="#FB923C" stroke-width="1" stroke-opacity="0.4"/>
  <text x="188" y="500" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">private: only code inside Product (and its nest)</text>

  <!-- same package -->
  <rect x="166" y="546" width="388" height="104" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="188" y="580" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">shop.Inventory</text>
  <text x="188" y="606" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">not a subclass, same package</text>
  <text x="188" y="630" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">sees stock, pricePaise, name</text>

  <!-- subclass in another package -->
  <rect x="612" y="316" width="244" height="208" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="632" y="350" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">outlet.SaleProduct</text>
  <text x="632" y="380" fill="#93B4D6" font-family="Arial, sans-serif" font-size="15">extends Product</text>
  <text x="632" y="404" fill="#93B4D6" font-family="Arial, sans-serif" font-size="15">sees pricePaise, name</text>
  <text x="632" y="440" fill="#93B4D6" font-family="Arial, sans-serif" font-size="15">protected only through</text>
  <text x="632" y="464" fill="#93B4D6" font-family="Arial, sans-serif" font-size="15">this, or a SaleProduct</text>
  <text x="632" y="488" fill="#93B4D6" font-family="Arial, sans-serif" font-size="15">(or subclass) reference</text>

  <!-- extends arrow -->
  <path d="M612 420H562" stroke="#60A5FA" stroke-width="2"/>
  <path d="M571 415L562 420L571 425" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- own type rule -->
  <rect x="612" y="546" width="244" height="104" rx="12" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="632" y="578" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">product.pricePaise through</text>
  <text x="632" y="602" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">a Product reference:</text>
  <text x="632" y="626" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">denied (JLS 6.6.2)</text>

  <!-- world -->
  <rect x="906" y="316" width="190" height="208" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="926" y="350" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">outlet.Checkout</text>
  <text x="926" y="380" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">no relation to</text>
  <text x="926" y="404" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">Product</text>
  <text x="926" y="440" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="15">sees name only</text>

  <text x="906" y="580" fill="#777777" font-family="Arial, sans-serif" font-size="14">javac rejects every</text>
  <text x="906" y="602" fill="#777777" font-family="Arial, sans-serif" font-size="14">other cell; the JVM</text>
  <text x="906" y="624" fill="#777777" font-family="Arial, sans-serif" font-size="14">checks again at link</text>
  <text x="906" y="646" fill="#777777" font-family="Arial, sans-serif" font-size="14">time</text>
</svg>
