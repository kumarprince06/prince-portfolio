<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">WHICH BODY RUNS? THE DEFAULT-METHOD RULES</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Checked top to bottom by javac, and again by HotSpot when it links the class. The first rule that applies decides.</text>

  <!-- rule 1 -->
  <rect x="80" y="160" width="440" height="96" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="104" y="198" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">1. Does a class declare m()?</text>
  <text x="104" y="228" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">the class itself or any superclass, even an abstract m()</text>

  <path d="M520 208H590" stroke="#FB923C" stroke-width="2"/>
  <path d="M582 203L591 208L582 213" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="536" y="196" fill="#888888" font-family="Arial, sans-serif" font-size="14">yes</text>

  <rect x="600" y="160" width="520" height="96" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="624" y="198" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">The class method wins</text>
  <text x="624" y="228" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">OldAlerts runs LegacyGateway.channel(); no default is consulted</text>

  <path d="M300 256V292" stroke="#FB923C" stroke-width="2"/>
  <path d="M295 284L300 293L305 284" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="312" y="280" fill="#888888" font-family="Arial, sans-serif" font-size="14">no</text>

  <!-- rule 2 -->
  <rect x="80" y="300" width="440" height="96" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="104" y="338" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">2. Is one default the most specific?</text>
  <text x="104" y="368" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">a sub-interface's default overrides its parent's</text>

  <path d="M520 348H590" stroke="#FB923C" stroke-width="2"/>
  <path d="M582 343L591 348L582 353" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="536" y="336" fill="#888888" font-family="Arial, sans-serif" font-size="14">yes</text>

  <rect x="600" y="300" width="520" height="96" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="624" y="338" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">That default wins</text>
  <text x="624" y="368" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">OrderAlerts and MixedAlerts run SmsNotifier.channel()</text>

  <path d="M300 396V432" stroke="#FB923C" stroke-width="2"/>
  <path d="M295 424L300 433L305 424" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="312" y="420" fill="#888888" font-family="Arial, sans-serif" font-size="14">no</text>

  <!-- rule 3 -->
  <rect x="80" y="440" width="440" height="96" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="104" y="478" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18">3. Otherwise: unrelated defaults</text>
  <text x="104" y="508" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">two of them, or a default plus an abstract method</text>

  <path d="M520 488H590" stroke="#FB923C" stroke-width="2"/>
  <path d="M582 483L591 488L582 493" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="600" y="440" width="520" height="96" rx="12" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="624" y="478" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="18">javac rejects it: the class must override m()</text>
  <text x="624" y="508" fill="#777777" font-family="Arial, sans-serif" font-size="14">and can pick a parent's body with MapsSdk.super.healthCheck()</text>

  <!-- diamond sketch -->
  <text x="80" y="580" fill="#888888" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">RULE 3 AS A DIAMOND</text>
  <rect x="80" y="594" width="200" height="52" rx="10" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="98" y="616" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">MapsSdk</text>
  <text x="98" y="636" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">default healthCheck()</text>
  <rect x="320" y="594" width="200" height="52" rx="10" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="338" y="616" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">PaymentsSdk</text>
  <text x="338" y="636" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="13">default healthCheck()</text>
  <rect x="160" y="686" width="280" height="48" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="178" y="707" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">TwoVendors</text>
  <text x="178" y="726" fill="#C6A17A" font-family="Arial, sans-serif" font-size="13">implements both, must override</text>
  <path d="M220 686L186 650" stroke="#FB923C" stroke-width="2"/>
  <path d="M185.5 660L185 649L195.5 651.5" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M380 686L414 650" stroke="#FB923C" stroke-width="2"/>
  <path d="M404.5 651.5L415 649L414.5 660" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="672" fill="#888888" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">implements</text>

  <!-- notes -->
  <text x="600" y="580" fill="#888888" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">NOT PART OF THE CONTEST</text>
  <text x="600" y="618" fill="#888888" font-family="Arial, sans-serif" font-size="15">Static interface methods: never inherited, so never in conflict.</text>
  <text x="600" y="646" fill="#888888" font-family="Arial, sans-serif" font-size="15">Constants: two MAX_ITEMS fields make the simple name</text>
  <text x="600" y="668" fill="#888888" font-family="Arial, sans-serif" font-size="15">ambiguous; the qualified names still compile.</text>
  <text x="600" y="696" fill="#888888" font-family="Arial, sans-serif" font-size="15">A conflict javac never saw (a jar changed later) fails at</text>
  <text x="600" y="718" fill="#888888" font-family="Arial, sans-serif" font-size="15">run time: IncompatibleClassChangeError when m() is called.</text>
</svg>
