<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120M80 490H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">HOW A JAVA PROGRAM RUNS</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Write once, compile to bytecode, run through a JVM.</text>

  <rect x="80" y="205" width="190" height="150" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="112" y="251" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">01</text>
  <text x="112" y="286" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23">Hello.java</text>
  <text x="112" y="318" fill="#888888" font-family="Arial, sans-serif" font-size="16">Source code</text>

  <path d="M270 280H345" stroke="#FB923C" stroke-width="3"/>
  <path d="M335 269L347 280L335 291" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="278" y="255" fill="#888888" font-family="Arial, sans-serif" font-size="14">javac</text>

  <rect x="350" y="205" width="190" height="150" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="382" y="251" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">02</text>
  <text x="382" y="286" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23">Hello.class</text>
  <text x="382" y="318" fill="#888888" font-family="Arial, sans-serif" font-size="16">Bytecode</text>

  <path d="M540 280H615" stroke="#FB923C" stroke-width="3"/>
  <path d="M605 269L617 280L605 291" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="255" fill="#888888" font-family="Arial, sans-serif" font-size="14">java</text>

  <rect x="620" y="175" width="230" height="210" rx="16" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="652" y="221" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">03</text>
  <text x="652" y="257" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23">JVM</text>
  <text x="652" y="289" fill="#C6A17A" font-family="Arial, sans-serif" font-size="16">Loads and verifies</text>
  <text x="652" y="316" fill="#C6A17A" font-family="Arial, sans-serif" font-size="16">the bytecode</text>
  <text x="652" y="350" fill="#888888" font-family="Arial, sans-serif" font-size="15">Interpreter + JIT</text>

  <path d="M850 280H925" stroke="#FB923C" stroke-width="3"/>
  <path d="M915 269L927 280L915 291" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="930" y="205" width="190" height="150" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="962" y="251" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">04</text>
  <text x="962" y="286" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23">Output</text>
  <text x="962" y="318" fill="#888888" font-family="Arial, sans-serif" font-size="16">Your app runs</text>

  <rect x="80" y="430" width="1040" height="1" fill="#2B2B2B"/>
  <text x="80" y="468" fill="#888888" font-family="Arial, sans-serif" font-size="16">The same bytecode can be used on different operating systems when a compatible JVM is available.</text>
