<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">HOW FAR AN ANNOTATION TRAVELS: @Retention</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">JDK 21. Trip.java carries three annotations; javap -v and getAnnotations() show what survives each step.</text>

  <!-- column headers -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#FFFFFF">
    <text x="80" y="170">Source (Trip.java)</text>
    <text x="400" y="170">javac writes Trip.class</text>
    <text x="720" y="170">Class loaded, reflection asks</text>
  </g>

  <!-- row 1: SOURCE -->
  <rect x="80" y="190" width="270" height="80" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="14" xml:space="preserve">
    <text x="98" y="222" fill="#FFFFFF">@SourceNote</text>
    <text x="98" y="248" fill="#C6A17A">SOURCE</text>
  </g>
  <path d="M350 230H390" stroke="#555555" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="400" y="190" width="290" height="80" rx="12" fill="#151515" stroke="#444444" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="418" y="222" fill="#888888" font-family="Arial, sans-serif" font-size="14">discarded after compilation:</text>
  <text x="418" y="246" fill="#888888" font-family="Arial, sans-serif" font-size="14">no trace, not even its text</text>
  <text x="720" y="236" fill="#666666" font-family="Arial, sans-serif" font-size="14">never reaches the JVM</text>
  <text x="960" y="236" fill="#888888" font-family="Arial, sans-serif" font-size="14">used by: processors</text>

  <!-- row 2: CLASS -->
  <rect x="80" y="290" width="270" height="80" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="14" xml:space="preserve">
    <text x="98" y="322" fill="#FFFFFF">@ClassNote</text>
    <text x="98" y="348" fill="#C6A17A">CLASS (the default)</text>
  </g>
  <path d="M350 330H390" stroke="#60A5FA" stroke-width="2"/>
  <path d="M381 325L390 330L381 335" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="290" width="290" height="80" rx="12" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="418" y="322" fill="#93B4D6">RuntimeInvisibleAnnotations</text>
    <text x="418" y="346" fill="#FFFFFF">  ClassNote(value="...")</text>
  </g>
  <path d="M690 330H710" stroke="#555555" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="720" y="326" fill="#888888" font-family="Arial, sans-serif" font-size="14">bytes are in the file, but</text>
  <text x="720" y="348" fill="#888888" font-family="Arial, sans-serif" font-size="14">isAnnotationPresent = false</text>
  <text x="960" y="336" fill="#888888" font-family="Arial, sans-serif" font-size="14">used by: bytecode tools</text>

  <!-- row 3: RUNTIME -->
  <rect x="80" y="390" width="270" height="80" rx="12" fill="#151515" stroke="#444444" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="14" xml:space="preserve">
    <text x="98" y="422" fill="#FFFFFF">@RuntimeNote</text>
    <text x="98" y="448" fill="#C6A17A">RUNTIME</text>
  </g>
  <path d="M350 430H390" stroke="#FB923C" stroke-width="2"/>
  <path d="M381 425L390 430L381 435" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="400" y="390" width="290" height="80" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="418" y="422" fill="#C6A17A">RuntimeVisibleAnnotations</text>
    <text x="418" y="446" fill="#FFFFFF">  RuntimeNote(value="...")</text>
  </g>
  <path d="M690 430H710" stroke="#FB923C" stroke-width="2"/>
  <path d="M701 425L710 430L701 435" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="390" width="400" height="80" rx="12" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="13" xml:space="preserve">
    <text x="738" y="422" fill="#FFFFFF">Trip.class.getAnnotations()</text>
    <text x="738" y="446" fill="#C6A17A">  -> [@RuntimeNote("visible...")]</text>
  </g>

  <!-- bottom: what getAnnotation returns -->
  <text x="80" y="520" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">What getAnnotation hands back: a proxy, built on the first read and cached in the Class</text>
  <g font-family="Arial, sans-serif" font-size="13">
    <rect x="80" y="540" width="250" height="84" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="96" y="566" fill="#FFFFFF">RuntimeVisible bytes only</text>
    <text x="96" y="588" fill="#93B4D6">Class.getRawAnnotations()</text>
    <text x="96" y="610" fill="#93B4D6">kept unparsed by HotSpot</text>

    <rect x="370" y="540" width="250" height="84" rx="10" fill="#0F1A21" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="386" y="566" fill="#FFFFFF">AnnotationParser</text>
    <text x="386" y="588" fill="#93B4D6">skips non-RUNTIME types,</text>
    <text x="386" y="610" fill="#93B4D6">fills defaults, element values</text>

    <rect x="660" y="540" width="460" height="84" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="1.5"/>
    <text x="676" y="566" fill="#FFFFFF">jdk.proxy2.$Proxy1 implements RuntimeNote</text>
    <text x="676" y="588" fill="#C6A17A">AnnotationInvocationHandler: value() reads a map</text>
    <text x="676" y="610" fill="#C6A17A">equals/hashCode by element values, arrays cloned</text>
  </g>
  <path d="M330 582H360" stroke="#60A5FA" stroke-width="2"/>
  <path d="M351 577L360 582L351 587" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M620 582H650" stroke="#FB923C" stroke-width="2"/>
  <path d="M641 577L650 582L641 587" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="80" y="664" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">No @Retention means CLASS: a reflection-based framework never sees it, and nothing warns you.</text>
</svg>
