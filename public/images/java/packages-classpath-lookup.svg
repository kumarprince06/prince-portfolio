<svg width="1200" height="740" viewBox="0 0 1200 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="740" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">FROM A PACKAGE NAME TO A CLASS FILE</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">java -cp classes:lib/shop-util.jar com.shop.app.ShopApp, and the moment running code first needs com.shop.order.Order</text>

  <!-- column labels -->
  <text x="80" y="168" fill="#888888" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">ON DISK · classpath entry 1</text>
  <text x="520" y="168" fill="#888888" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">THE APPLICATION CLASS LOADER</text>

  <!-- left: classes/ directory -->
  <rect x="80" y="185" width="390" height="455" rx="16" fill="#151515" stroke="#444444" stroke-width="2"/>
  <text x="100" y="215" fill="#AAAAAA" font-family="Arial, sans-serif" font-size="16">classes/</text>
  <text x="170" y="215" fill="#777777" font-family="Arial, sans-serif" font-size="14">(javac -d classes; com/shop/app/ not shown)</text>

  <!-- package com.shop.order -->
  <rect x="100" y="232" width="350" height="208" rx="12" fill="#0D0D0D" stroke="#FB923C" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="118" y="259" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">com/shop/order/</text>
  <text x="240" y="259" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">package com.shop.order</text>
  <rect x="118" y="272" width="314" height="44" rx="8" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="134" y="300" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">Order.class</text>
  <text x="300" y="300" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">public</text>
  <rect x="118" y="324" width="314" height="44" rx="8" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="134" y="352" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">OrderService.class</text>
  <text x="300" y="352" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">public</text>
  <rect x="118" y="376" width="314" height="44" rx="8" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="134" y="404" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">OrderRepository.class</text>
  <text x="300" y="404" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">package-private</text>

  <!-- package com.shop.payment -->
  <rect x="100" y="458" width="350" height="160" rx="12" fill="#0D0D0D" stroke="#FB923C" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="118" y="485" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">com/shop/payment/</text>
  <text x="258" y="485" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">package com.shop.payment</text>
  <rect x="118" y="498" width="314" height="44" rx="8" fill="#0F1A21" stroke="#60A5FA" stroke-width="2"/>
  <text x="134" y="526" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">PaymentService.class</text>
  <text x="300" y="526" fill="#93B4D6" font-family="Arial, sans-serif" font-size="14">public</text>
  <rect x="118" y="550" width="314" height="44" rx="8" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="134" y="578" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">CardGateway.class</text>
  <text x="300" y="578" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">package-private</text>

  <!-- right: loader steps -->
  <rect x="520" y="185" width="600" height="58" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="540" y="210" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">1  loadClass("com.shop.order.Order")</text>
  <text x="540" y="232" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">the binary name of a class the running code refers to: com/shop/order/Order</text>
  <path d="M820 243V259" stroke="#FB923C" stroke-width="2"/>
  <path d="M815 251L820 260L825 251" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="520" y="262" width="600" height="58" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="540" y="287" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">2  ask the parent loaders first</text>
  <text x="540" y="309" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">platform and boot loaders own java.*, javax.* ... not theirs, so continue</text>
  <path d="M820 320V336" stroke="#FB923C" stroke-width="2"/>
  <path d="M815 328L820 337L825 328" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="520" y="339" width="600" height="58" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="540" y="364" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">3  dots become slashes, add .class</text>
  <text x="540" y="386" fill="#C6A17A" font-family="Arial, sans-serif" font-size="14">com.shop.order.Order  →  com/shop/order/Order.class</text>
  <path d="M820 397V413" stroke="#FB923C" stroke-width="2"/>
  <path d="M815 405L820 414L825 405" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- classpath entries -->
  <rect x="520" y="416" width="600" height="112" rx="10" fill="#132433" stroke="#60A5FA" stroke-width="2"/>
  <text x="540" y="441" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">4  try each classpath entry, left to right</text>
  <text x="540" y="471" fill="#93B4D6" font-family="Arial, sans-serif" font-size="15">entry 1  classes/com/shop/order/Order.class</text>
  <text x="1010" y="471" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15">found</text>
  <text x="540" y="505" fill="#777777" font-family="Arial, sans-serif" font-size="15">entry 2  lib/shop-util.jar</text>
  <text x="895" y="505" fill="#777777" font-family="Arial, sans-serif" font-size="14">not searched: first match wins</text>

  <!-- found arrow back to Order.class -->
  <path d="M520 466H490V294H442" stroke="#60A5FA" stroke-width="2"/>
  <path d="M451 289L442 294L451 299" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M820 528V544" stroke="#FB923C" stroke-width="2"/>
  <path d="M815 536L820 545L825 536" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="547" width="600" height="71" rx="10" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="540" y="572" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16">5  defineClass: the runtime package is a pair</text>
  <text x="540" y="598" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">(app class loader, "com.shop.order")</text>

  <!-- footer -->
  <text x="80" y="672" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">- - -</text>
  <text x="118" y="672" fill="#888888" font-family="Arial, sans-serif" font-size="15">package-private boundary: CardGateway and OrderRepository are invisible outside their own package.</text>
  <text x="118" y="698" fill="#888888" font-family="Arial, sans-serif" font-size="15">From com.shop.app, javac says "OrderRepository is not public in com.shop.order; cannot be accessed from outside package".</text>
</svg>
