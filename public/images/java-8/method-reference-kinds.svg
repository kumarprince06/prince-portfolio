<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">THE FOUR KINDS OF METHOD REFERENCE</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Each one is shorthand for a lambda that only calls one method.</text>
  <text x="104" y="165" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">KIND</text>
  <text x="400" y="165" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">METHOD REFERENCE</text>
  <text x="700" y="165" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">SAME AS THIS LAMBDA</text>
  <rect x="80" y="185" width="1040" height="78" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="104" y="219" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">Static</text>
  <text x="104" y="245" fill="#888888" font-family="Arial, sans-serif" font-size="15">Class::staticMethod</text>
  <text x="400" y="232" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">Integer::parseInt</text>
  <text x="700" y="232" fill="#888888" font-family="Arial, sans-serif" font-size="19">s -&gt; Integer.parseInt(s)</text>
  <rect x="80" y="277" width="1040" height="78" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="104" y="311" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">Bound instance</text>
  <text x="104" y="337" fill="#888888" font-family="Arial, sans-serif" font-size="15">object::method</text>
  <text x="400" y="324" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">System.out::println</text>
  <text x="700" y="324" fill="#888888" font-family="Arial, sans-serif" font-size="19">x -&gt; System.out.println(x)</text>
  <rect x="80" y="369" width="1040" height="78" rx="16" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="104" y="403" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">Unbound instance</text>
  <text x="104" y="429" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">Class::instanceMethod</text>
  <text x="400" y="416" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">String::toUpperCase</text>
  <text x="700" y="416" fill="#C6A17A" font-family="Arial, sans-serif" font-size="19">s -&gt; s.toUpperCase()</text>
  <rect x="80" y="461" width="1040" height="78" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="104" y="495" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">Constructor</text>
  <text x="104" y="521" fill="#888888" font-family="Arial, sans-serif" font-size="15">Class::new</text>
  <text x="400" y="508" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">ArrayList::new</text>
  <text x="700" y="508" fill="#888888" font-family="Arial, sans-serif" font-size="19">() -&gt; new ArrayList&lt;&gt;()</text>
  <text x="80" y="580" fill="#888888" font-family="Arial, sans-serif" font-size="15">Unbound: the first argument becomes the receiver. Bound: the receiver is evaluated once, when the reference is made.</text>
</svg>
