<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">DEFAULT METHOD DIAMOND</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Two interfaces give the same default. Who wins?</text>
  <rect x="80" y="165" width="220" height="110" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="104" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">interface A</text>
  <text x="104" y="240" fill="#888888" font-family="Arial, sans-serif" font-size="15">default void hello()</text>
  <rect x="340" y="165" width="220" height="110" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="364" y="205" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">interface B</text>
  <text x="364" y="240" fill="#888888" font-family="Arial, sans-serif" font-size="15">default void hello()</text>
  <rect x="110" y="370" width="420" height="160" rx="16" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="134" y="408" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">class C implements A, B</text>
  <text x="134" y="440" fill="#FB923C" font-family="Arial, sans-serif" font-size="15">Compile error unless C overrides:</text>
  <text x="134" y="470" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">public void hello() {</text>
  <text x="158" y="496" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">A.super.hello();  }</text>
  <path d="M250 368 L205 282" stroke="#FB923C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M201.8 293.6L205 282L216.3 286.0" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M390 368 L435 282" stroke="#FB923C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M423.7 286.0L435 282L438.2 293.6" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="330" fill="#888888" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">implements</text>
  <rect x="620" y="165" width="500" height="110" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="644" y="203" fill="#FB923C" font-family="Arial, sans-serif" font-size="20">1</text>
  <text x="676" y="203" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">A class always wins</text>
  <text x="676" y="233" fill="#888888" font-family="Arial, sans-serif" font-size="15">A method from a superclass (or C itself)</text>
  <text x="676" y="257" fill="#888888" font-family="Arial, sans-serif" font-size="15">beats any interface default.</text>
  <rect x="620" y="290" width="500" height="110" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="644" y="328" fill="#FB923C" font-family="Arial, sans-serif" font-size="20">2</text>
  <text x="676" y="328" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">More specific interface wins</text>
  <text x="676" y="358" fill="#888888" font-family="Arial, sans-serif" font-size="15">If B extends A, B&#x27;s hello() is chosen</text>
  <text x="676" y="382" fill="#888888" font-family="Arial, sans-serif" font-size="15">over A&#x27;s.</text>
  <rect x="620" y="415" width="500" height="110" rx="16" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="644" y="453" fill="#FB923C" font-family="Arial, sans-serif" font-size="20">3</text>
  <text x="676" y="453" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20">Otherwise, override it</text>
  <text x="676" y="483" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">Pick one inside the override with</text>
  <text x="676" y="507" fill="#C6A17A" font-family="Arial, sans-serif" font-size="15">A.super.hello() or B.super.hello().</text>
  <text x="80" y="580" fill="#888888" font-family="Arial, sans-serif" font-size="16">Checked top to bottom: rule 1 first, then rule 2, and only then rule 3.</text>
</svg>
