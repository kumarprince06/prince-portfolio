<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="28" fill="#0D0D0D"/>
  <path d="M80 130H1120" stroke="#2B2B2B" stroke-width="2"/>
  <text x="80" y="82" fill="#FB923C" font-family="Arial, sans-serif" font-size="18" letter-spacing="4">ANONYMOUS CLASS VS LAMBDA</text>
  <text x="80" y="112" fill="#777777" font-family="Arial, sans-serif" font-size="16">Same behaviour, less ceremony.</text>
  <rect x="80" y="160" width="500" height="330" rx="16" fill="#171717" stroke="#555555" stroke-width="2"/>
  <text x="110" y="200" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">BEFORE  ·  ANONYMOUS CLASS</text>
  <text x="110" y="245" fill="#DDDDDD" font-family="Arial, sans-serif" font-size="17">Runnable task = new Runnable() {</text>
  <text x="146" y="275" fill="#DDDDDD" font-family="Arial, sans-serif" font-size="17">@Override</text>
  <text x="146" y="305" fill="#DDDDDD" font-family="Arial, sans-serif" font-size="17">public void run() {</text>
  <text x="182" y="335" fill="#DDDDDD" font-family="Arial, sans-serif" font-size="17">System.out.println(&quot;Placed&quot;);</text>
  <text x="146" y="365" fill="#DDDDDD" font-family="Arial, sans-serif" font-size="17">}</text>
  <text x="110" y="395" fill="#DDDDDD" font-family="Arial, sans-serif" font-size="17">};</text>
  <text x="110" y="460" fill="#888888" font-family="Arial, sans-serif" font-size="15">6 lines  ·  compiles to an extra Main$1.class</text>
  <path d="M590 325 L618 325" stroke="#FB923C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M609.2 316.8L618 325L609.2 333.2" stroke="#FB923C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="628" y="160" width="492" height="330" rx="16" fill="#21180F" stroke="#FB923C" stroke-width="2"/>
  <text x="658" y="200" fill="#FB923C" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">AFTER  ·  LAMBDA</text>
  <text x="658" y="245" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">Runnable task =</text>
  <text x="694" y="275" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17">() -&gt; System.out.println(&quot;Placed&quot;);</text>
  <text x="658" y="330" fill="#C6A17A" font-family="Arial, sans-serif" font-size="16">Runnable has one abstract method, run(),</text>
  <text x="658" y="358" fill="#C6A17A" font-family="Arial, sans-serif" font-size="16">so the compiler knows the lambda is its body.</text>
  <text x="658" y="460" fill="#888888" font-family="Arial, sans-serif" font-size="15">1 statement  ·  no extra .class file on disk</text>
  <text x="80" y="550" fill="#888888" font-family="Arial, sans-serif" font-size="16">Both print &quot;Placed&quot; when task.run() is called. The lambda just drops the boilerplate.</text>
</svg>
